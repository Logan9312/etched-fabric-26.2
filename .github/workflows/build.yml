# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Server-test-reports
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  client_game_test:
    name: Client mixins and resources
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, etched-ci]
    timeout-minutes: 20
    env:
      # OpenAL's null backend exercises sound-engine initialization on a
      # headless runner without requiring a physical sound card.
      ALSOFT_DRIVERS: "null"
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: install headless graphics support
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth libgl1 libglx-mesa0 libasound2
          fi
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        run: ./gradlew runClientGameTest
      - name: smoke test the production jar
        run: ./gradlew runProductionClientGameTest
      - name: capture client test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Client-game-test-evidence
          if-no-files-found: warn
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
