plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

loom {
	mods {
		"etched" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "etched-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

sourceSets.main.java {
	// Runtime resources are checked in. The NeoForge datagen providers are kept
	// as porting references until Fabric-native providers replace them.
	exclude 'gg/moonflower/etched/core/data/**'
	// Sophisticated Core has no equivalent wired into this private Fabric port yet.
	exclude 'gg/moonflower/etched/core/compat/**'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	include implementation("javazoom:jlayer:1.0.1")
	implementation "commons-io:commons-io:2.18.0"
	implementation "commons-codec:commons-codec:1.17.2"
	implementation "org.apache.commons:commons-lang3:3.17.0"
}

tasks.register('parityTest', JavaExec) {
	group = 'verification'
	description = 'Runs lightweight codec regression checks that do not require a game instance.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'gg.moonflower.etched.common.network.play.PacketCodecParityCheck'
	systemProperty 'etched.projectDir', project.projectDir.absolutePath
	def parityWorkDir = layout.buildDirectory.dir('parity-test')
	doFirst {
		parityWorkDir.get().asFile.mkdirs()
		workingDir parityWorkDir
	}
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.addAll("-Dfabric.client.gametest", "-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	useXVFB = true
}

check.dependsOn parityTest

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
